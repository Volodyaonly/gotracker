apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotracker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gotracker

  template:
    metadata:
      labels:
        app: gotracker

    spec:
      containers:
        - name: gotracker
          image: gotracker:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PORT
              value: "8080"

            - name: REDIS_ADDR
              value: "redis:6379"

            - name: REDIS_TTL
              value: "60"

            - name: KAFKA_BROKER
              value: "kafka:9092"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gotracker
spec:
  selector:
    app: gotracker

  ports:
    - port: 8080
      targetPort: 8080

  type: NodePort